[build-system]
requires = [ "setuptools>=68" ]
build-backend = "setuptools.build_meta"

[project]
name = "llmtop"
version = "0.1.0"
description = "btop-style TUI for self-hosted LLM inference engines and the clients hitting them"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "textual>=8.0",
  "rich>=14.0",
]

[project.scripts]
llmtop = "llmtop.__main__:main"

[tool.setuptools.packages.find]
where = [ "src" ]

[tool.pytest.ini_options]
testpaths = [ "tests" ]
